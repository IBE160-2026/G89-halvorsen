<div id="study-concepts" lang="nb" aria-label="Fem visuelle konsepter for AI Study Buddy">
  <style>
    #study-concepts { color-scheme: light dark; min-width: 0; }
    #study-concepts .comparison-controls { margin-bottom: 20px; }
    #study-concepts .concept-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 30px 22px; align-items: start; }
    #study-concepts .concept { min-width: 0; }
    #study-concepts .concept.is-wide { grid-column: 1 / -1; }
    #study-concepts .concept-caption { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    #study-concepts .concept-description { margin-top: 5px; margin-bottom: 12px; }
    #study-concepts .app-frame { container: studyapp / inline-size; min-width: 0; }
    #study-concepts .app-shell, #study-concepts .app-shell * { box-sizing: border-box; }
    #study-concepts .app-shell {
      --app-bg: light-dark(#f2f5f8, #17212c); --app-surface: light-dark(#fff, #202e3a);
      --app-ink: light-dark(#213244, #eaf0f5); --app-muted: light-dark(#536778, #b3c3d1);
      --app-accent: light-dark(#294b70, #a8caed); --app-line: light-dark(#cbd7e1, #3f5364); --app-soft: light-dark(#e1eaf2, #304c63);
      position: relative; min-height: 532px; display: grid; grid-template-rows: auto auto 1fr;
      border: 1px solid var(--app-line); border-radius: 12px; background: var(--app-bg); color: var(--app-ink);
      font: 400 14px/1.55 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #study-concepts .app-shell [hidden] { display: none !important; }
    #study-concepts .app-brandbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 17px 20px; min-width: 0; }
    #study-concepts .app-brand { font-size: 16px; font-weight: 600; letter-spacing: -.02em; }
    #study-concepts .sample-label { color: var(--app-muted); font-size: 11px; }
    #study-concepts .app-nav { display: flex; gap: 4px; padding: 8px 16px; }
    #study-concepts .app-shell button { font-family: inherit; }
    #study-concepts .nav-choice { color: var(--app-muted); background: transparent; border: 0; padding: 10px 8px; min-height: 44px; font-size: 12px; font-weight: 500; white-space: nowrap; }
    #study-concepts .nav-choice[aria-pressed="true"] { color: var(--app-accent); background: var(--app-soft); font-weight: 600; }
    #study-concepts .nav-choice:hover { background: var(--app-soft); }
    #study-concepts .app-main { padding: 22px; min-width: 0; }
    #study-concepts .doc-context { margin-bottom: 20px; }
    #study-concepts .doc-name { margin: 0; font-size: 17px; line-height: 1.4; font-weight: 600; overflow-wrap: anywhere; }
    #study-concepts .session-meta { margin: 4px 0 0; color: var(--app-muted); font-size: 11px; }
    #study-concepts .learning-view { display: grid; gap: 14px; align-content: start; }
    #study-concepts .item-count { color: var(--app-muted); margin: 0; font-size: 12px; font-variant-numeric: tabular-nums; }
    #study-concepts .flashcard { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 22px; width: 100%; min-height: 200px; padding: 25px 20px; text-align: center; color: var(--app-ink); background: var(--app-surface); border: 1px solid var(--app-line); border-radius: 14px; }
    #study-concepts .card-prompt { font-size: 22px; line-height: 1.4; font-weight: 500; }
    #study-concepts .card-answer { font-size: 17px; line-height: 1.6; }
    #study-concepts .flip-hint { font-size: 11px; color: var(--app-muted); }
    #study-concepts .card-actions { display: flex; justify-content: space-between; gap: 12px; }
    #study-concepts .small-action { display: inline-flex; justify-content: center; align-items: center; min-height: 44px; padding: 9px 14px; font-size: 12px; color: var(--app-ink); background: var(--app-surface); border: 1px solid var(--app-line); border-radius: 6px; }
    #study-concepts .small-action:hover:not(:disabled) { background: var(--app-soft); }
    #study-concepts .app-shell button:disabled { opacity: .45; }
    #study-concepts .source-link { justify-self: start; min-height: 44px; padding: 6px 0; background: none; border: 0; color: var(--app-accent); text-decoration: underline; text-underline-offset: 3px; font-size: 12px; text-align: left; }
    #study-concepts .primary-action { justify-self: start; min-height: 44px; padding: 10px 16px; border: 0; border-radius: 6px; color: var(--app-surface); background: var(--app-accent); font-size: 13px; font-weight: 600; }
    #study-concepts .summary-copy { display: grid; gap: 14px; max-width: 68ch; font-size: 15px; line-height: 1.7; }
    #study-concepts .summary-copy h4 { font-size: 20px; line-height: 1.3; margin: 0; font-weight: 600; }
    #study-concepts .summary-copy p, #study-concepts .summary-copy ul { margin: 0; }
    #study-concepts .summary-copy ul { padding-left: 20px; }
    #study-concepts .summary-copy li + li { margin-top: 7px; }
    #study-concepts .summary-sources { display: flex; gap: 18px; flex-wrap: wrap; }
    #study-concepts .quiz-options { padding: 0; margin: 0; border: 0; min-width: 0; }
    #study-concepts .quiz-options legend { padding: 0; margin-bottom: 16px; font-size: 18px; line-height: 1.4; font-weight: 500; }
    #study-concepts .quiz-options label { display: flex; gap: 10px; align-items: flex-start; min-height: 44px; padding: 10px 0; }
    #study-concepts .quiz-options input { flex: 0 0 auto; accent-color: var(--app-accent); margin: 5px 0 0; width: 16px; height: 16px; }
    #study-concepts .quiz-result { margin: 0; font-size: 14px; line-height: 1.6; }
    #study-concepts .source-panel { position: absolute; top: 0; right: 0; bottom: 0; width: min(100%, 290px); z-index: 2; padding: 22px; display: grid; align-content: start; gap: 20px; background: var(--app-surface); border-left: 1px solid var(--app-line); color: var(--app-ink); border-radius: 0 12px 12px 0; }
    #study-concepts .source-heading { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
    #study-concepts .source-heading h4 { margin: 0; font-size: 18px; }
    #study-concepts .source-file, #study-concepts .source-note { margin: 0; font-size: 12px; line-height: 1.7; color: var(--app-muted); }
    #study-concepts .source-panel blockquote { padding: 0; margin: 0; font-size: 16px; line-height: 1.7; }
    #study-concepts .source-panel mark { color: var(--app-ink); background: var(--app-soft); }
    #study-concepts .app-shell ::selection { color: var(--app-ink); background: var(--app-soft); }
    @media (max-width: 760px) { #study-concepts .concept-grid { grid-template-columns: minmax(0, 1fr); } }
    @container studyapp (max-width: 370px) {
      #study-concepts .app-brandbar { padding: 16px; }
      #study-concepts .app-main { padding: 18px 16px; }
      #study-concepts .app-nav { justify-content: space-between; }
      #study-concepts .nav-choice { flex: 1; padding-inline: 5px; }
      #study-concepts .flashcard { min-height: 208px; padding: 22px 16px; }
      #study-concepts .card-prompt { font-size: 21px; }
    }
    /* THEME_STYLES */
  </style>
  <div class="viz-row comparison-controls" role="group" aria-label="Velg samme visning i alle konsepter">
    <span>Vis i alle:</span>
    <button class="btn btn-ghost" type="button" data-show-all="summary" aria-pressed="false">Summary</button>
    <button class="btn btn-ghost" type="button" data-show-all="flashcards" aria-pressed="true">Flashcards</button>
    <button class="btn btn-ghost" type="button" data-show-all="quiz" aria-pressed="false">Quiz</button>
  </div>
  <div class="concept-grid"><!-- CONCEPT_MARKUP --></div>
  <script>
    (() => {
      const root = document.getElementById('study-concepts');
      const cards = [
        { question: 'Hva betyr aktiv gjenhenting?', answer: 'Å hente frem det du har lært uten å se i notatene først.', page: 2, excerpt: 'Aktiv gjenhenting betyr å hente frem lært stoff uten å se i notatene først.' },
        { question: 'Hvorfor kontrollere svaret i notatene?', answer: 'For å oppdage det som mangler eller trenger en korrigering.', page: 2, excerpt: 'Sammenlign svaret med notatene for å oppdage det som mangler eller trenger en korrigering.' },
        { question: 'Hva innebærer repetisjon over flere økter?', answer: 'Å vende tilbake til det samme stoffet i ulike studieøkter.', page: 3, excerpt: 'Repetisjon over flere økter innebærer å vende tilbake til det samme stoffet i ulike studieøkter.' }
      ];
      const states = new Map();
      const validViews = new Set(['summary', 'flashcards', 'quiz']);
      root.querySelectorAll('[data-app]').forEach(app => states.set(app, { view: 'flashcards', card: 0, flipped: false, confirmed: false, sourceTrigger: null }));
      function savePreview() {
        const concepts = {};
        states.forEach((state, app) => { concepts[app.dataset.app] = { view: state.view, card: state.card, flipped: state.flipped, expanded: app.closest('.concept').classList.contains('is-wide') }; });
        const result = window.openai?.setWidgetState?.({ privateContent: { kind: 'study-concepts', concepts }, modelContent: null });
        result?.catch?.(() => {});
      }
      function restorePreview(saved) {
        if (!saved || saved.kind !== 'study-concepts' || !saved.concepts) return;
        states.forEach((state, app) => {
          const value = saved.concepts[app.dataset.app];
          if (!value || typeof value !== 'object') return;
          if (validViews.has(value.view)) setView(app, value.view);
          if (Number.isInteger(value.card)) state.card = Math.max(0, Math.min(cards.length - 1, value.card));
          state.flipped = value.flipped === true;
          renderCard(app);
          const expanded = value.expanded === true, concept = app.closest('.concept'), button = concept.querySelector('[data-expand]');
          concept.classList.toggle('is-wide', expanded);
          button.setAttribute('aria-expanded', String(expanded));
          button.textContent = expanded ? 'Vis i sammenligning' : 'Se større';
        });
      }
      function closeSource(app, returnFocus = false) {
        app.querySelector('.source-panel').hidden = true;
        app.querySelectorAll('[data-source]').forEach(button => button.setAttribute('aria-expanded', 'false'));
        const trigger = states.get(app).sourceTrigger;
        if (returnFocus && trigger && !trigger.hidden) trigger.focus();
      }
      function renderCard(app) {
        const state = states.get(app), card = cards[state.card];
        app.querySelector('[data-card-count]').textContent = `Kort ${state.card + 1} av ${cards.length} · eksempelsett`;
        app.querySelector('.card-prompt').textContent = card.question;
        app.querySelector('.card-prompt').hidden = state.flipped;
        app.querySelector('.card-answer').textContent = card.answer;
        app.querySelector('.card-answer').hidden = !state.flipped;
        app.querySelector('.flip-hint').textContent = state.flipped ? 'Klikk for å se spørsmålet' : 'Klikk for å se svaret';
        const flip = app.querySelector('[data-flip]');
        flip.setAttribute('aria-pressed', String(state.flipped));
        flip.setAttribute('aria-label', state.flipped ? `${card.answer} Klikk for å se spørsmålet.` : `Flashcard: ${card.question} Klikk for å vise svaret.`);
        const source = app.querySelector('[data-source="card"]');
        source.hidden = !state.flipped;
        source.textContent = `Vis kilde · side ${card.page}`;
        app.querySelector('[data-card-step="-1"]').disabled = state.card === 0;
        app.querySelector('[data-card-step="1"]').disabled = state.card === cards.length - 1;
        app.querySelector('[data-card-restart]').hidden = state.card !== cards.length - 1;
      }
      function syncGlobalNav() {
        root.querySelectorAll('[data-show-all]').forEach(button => button.setAttribute('aria-pressed', String([...states.values()].every(state => state.view === button.dataset.showAll))));
      }
      function setView(app, view) {
        if (!validViews.has(view)) return;
        const state = states.get(app);
        if (state.view !== view && view === 'flashcards') { state.flipped = false; renderCard(app); }
        state.view = view;
        closeSource(app);
        app.querySelectorAll('.nav-choice').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.view === view)));
        app.querySelectorAll('[data-panel]').forEach(panel => panel.hidden = panel.dataset.panel !== view);
        syncGlobalNav();
      }
      function openSource(app, button) {
        const state = states.get(app);
        const card = button.dataset.source === 'card' ? cards[state.card] : button.dataset.source === 'summary-repetition' ? cards[2] : button.dataset.source === 'summary' ? { page: 2, excerpt: `${cards[0].excerpt} ${cards[1].excerpt}` } : cards[0];
        state.sourceTrigger = button;
        app.querySelector('[data-excerpt]').textContent = card.excerpt;
        app.querySelector('[data-source-page]').textContent = card.page;
        app.querySelector('.source-panel').hidden = false;
        button.setAttribute('aria-expanded', 'true');
        app.querySelector('[data-close-source]').focus();
      }
      function resetQuiz(app) {
        const state = states.get(app);
        state.confirmed = false;
        app.querySelectorAll('input[type="radio"]').forEach(input => { input.checked = false; input.disabled = false; });
        const confirm = app.querySelector('[data-confirm]');
        confirm.hidden = false; confirm.disabled = true;
        app.querySelector('[data-feedback]').hidden = true;
        app.querySelector('[data-source="quiz"]').hidden = true;
        app.querySelector('[data-quiz-restart]').hidden = true;
        closeSource(app);
      }
      root.addEventListener('click', event => {
        const button = event.target.closest('button');
        if (!button || !root.contains(button)) return;
        if (button.dataset.showAll) { states.forEach((_, app) => setView(app, button.dataset.showAll)); return; }
        if (button.hasAttribute('data-expand')) {
          const concept = button.closest('.concept'), expanded = !concept.classList.contains('is-wide');
          concept.classList.toggle('is-wide', expanded);
          button.setAttribute('aria-expanded', String(expanded));
          button.textContent = expanded ? 'Vis i sammenligning' : 'Se større';
          return;
        }
        const app = button.closest('[data-app]');
        if (!app) return;
        const state = states.get(app);
        if (button.dataset.view) setView(app, button.dataset.view);
        else if (button.hasAttribute('data-flip')) { state.flipped = !state.flipped; closeSource(app); renderCard(app); }
        else if (button.hasAttribute('data-card-step')) { state.card = Math.min(cards.length - 1, Math.max(0, state.card + Number(button.dataset.cardStep))); state.flipped = false; closeSource(app); renderCard(app); }
        else if (button.hasAttribute('data-card-restart')) { state.card = 0; state.flipped = false; closeSource(app); renderCard(app); }
        else if (button.dataset.source) openSource(app, button);
        else if (button.hasAttribute('data-close-source')) closeSource(app, true);
        else if (button.hasAttribute('data-quiz-restart')) resetQuiz(app);
        else if (button.hasAttribute('data-confirm')) {
          const answer = app.querySelector('input[type="radio"]:checked');
          if (!answer || state.confirmed) return;
          state.confirmed = true;
          app.querySelectorAll('input[type="radio"]').forEach(input => input.disabled = true);
          button.hidden = true;
          const correct = answer.value === '0';
          const feedback = app.querySelector('[data-feedback]');
          feedback.textContent = correct ? 'Riktig. Du hentet frem stoffet uten å se i notatene. Resultat: 1 av 1 riktig (100 %).' : 'Ikke riktig. Riktig svar er å forklare uten å se i notatene. Å lese eller kopiere viser teksten fremfor å hente den frem fra hukommelsen. Resultat: 0 av 1 riktig (0 %). Spørsmål å gjennomgå: Hva er aktiv gjenhenting?';
          feedback.hidden = false;
          app.querySelector('[data-source="quiz"]').hidden = false;
          app.querySelector('[data-quiz-restart]').hidden = false;
        }
      });
      root.addEventListener('change', event => {
        if (!event.target.matches('input[type="radio"]')) return;
        const app = event.target.closest('[data-app]');
        if (app && !states.get(app).confirmed) app.querySelector('[data-confirm]').disabled = false;
        savePreview();
      });
      root.addEventListener('keydown', event => { if (event.key === 'Escape') { const app = event.target.closest('[data-app]'); if (app) closeSource(app, true); } });
      root.addEventListener('click', event => { if (event.target.closest('button')) savePreview(); });
      states.forEach((_, app) => renderCard(app));
      restorePreview(window.openai?.widgetState?.privateContent);
      window.addEventListener('openai:set_globals', event => restorePreview(event.detail?.globals?.widgetState?.privateContent));
    })();
  </script>
</div>
