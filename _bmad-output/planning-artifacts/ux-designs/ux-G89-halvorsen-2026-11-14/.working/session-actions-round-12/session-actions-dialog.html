      <div class="session-modal-layer" data-session-overlay hidden>
        <section class="session-confirmation" role="dialog" aria-modal="true" aria-labelledby="session-dialog-title" aria-describedby="session-dialog-message session-dialog-next session-dialog-note" data-session-dialog>
          <h2 id="session-dialog-title">Start a new session?</h2>
          <p id="session-dialog-message">The current PDF, study material and progress will be removed from this session.</p>
          <p id="session-dialog-next">You will return to Home to choose a PDF, study material language and Summary detail again.</p>
          <p class="session-confirmation-note" id="session-dialog-note">The original PDF on your device will not be changed.</p>
          <div class="session-confirmation-actions">
            <button class="secondary-action cursor-interaction" type="button" data-session-cancel>Cancel</button>
            <button class="primary-action cursor-interaction" type="button" data-session-confirm>Start new session</button>
          </div>
        </section>
      </div>
